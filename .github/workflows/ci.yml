name: AIDE CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIDE_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet debugpy
      - run: npm ci
      - run: node scripts/ci-run-all.mjs
      - run: npm run check
      - run: npm run veritas
