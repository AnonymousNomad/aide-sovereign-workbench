name: Veritas

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run veritas
      - run: npm run veritas -- --report --output artifacts/veritas.md
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veritas-report
          path: artifacts/veritas.md
