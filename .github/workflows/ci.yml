name: AIDE CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIDE_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet debugpy
      - run: npm ci
      - run: node scripts/ci-run-all.mjs
      - name: type checks and lint
        timeout-minutes: 10
        run: npx tsc -p tsconfig.node.json && npx tsc -p browser/tsconfig.browser.json && npx eslint .
      - name: architecture tests (bounded)
        timeout-minutes: 20
        run: |
          set +e
          timeout -k 30 900 node --test --test-concurrency=3 --test-timeout=90000 "tests/arch/*.test.ts" > /tmp/arch-out.txt 2>&1
          status=$?
          echo "node --test exit=$status"
          echo "=== output tail ==="
          tail -60 /tmp/arch-out.txt
          echo "=== end tail ==="
          if [ $status -ne 0 ]; then
            echo "::error::ARCH_TAIL1: $(tail -c 3000 /tmp/arch-out.txt | tr '\n' ';' | head -c 2950)"
            echo "::error::ARCH_TAIL2: $(tail -c 6000 /tmp/arch-out.txt | head -c 3000 | tr '\n' ';' | head -c 2950)"
            echo "::error::ARCH_PS: $(ps -eo pid,ppid,etime,cmd | head -40 | tr '\n' ';' | head -c 2950)"
            exit 1
          fi
          exit 0
      - name: upload arch test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-test-log
          path: /tmp/arch-out.txt
          if-no-files-found: ignore
      - run: npm run veritas
      - run: npm run veritas -- --report --output artifacts/veritas.md
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veritas-report
          path: artifacts/veritas.md
