name: AIDE CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIDE_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet debugpy
      - run: npm ci
      - run: node scripts/ci-run-all.mjs
      - name: type checks and lint
        timeout-minutes: 10
        run: npx tsc -p tsconfig.node.json && npx tsc -p browser/tsconfig.browser.json && npx eslint .
      - name: architecture tests (bounded)
        timeout-minutes: 20
        run: node --test --test-concurrency=3 --test-timeout=90000 "tests/arch/*.test.ts"
      - run: npm run veritas
      - run: npm run veritas -- --report --output artifacts/veritas.md
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veritas-report
          path: artifacts/veritas.md
